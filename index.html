<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limanet — Sistema de Nutrição</title>
<style>
:root{
  --bg:#d0d4d8; --panel:#fff; --line:#c5d5c8; --text:#1a2a35; --muted:#5a6f7d;
  --primary:#2d6a4f; --primary2:#1b4332; --accent:#40916c; --danger:#c0392b;
  --menu:#1b4332; --menuHover:#2d6a4f; --header:#1b4332;
  --ok:#1e7e4a; --warn:#b8860b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:13px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* LOGIN */
#loginScreen{min-height:100vh;display:flex;align-items:flex-end;justify-content:center;padding:12vh 16px 7vh;position:relative;overflow:hidden;background:linear-gradient(145deg,#e8f4fc,#c5e4f7 45%,#a8d4f0 75%,#7eb8e0)}
.loginBox{background:#fff;border-radius:10px;padding:28px 32px;width:min(400px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.35);margin-top:auto}
.loginLogo{display:block;width:168px;height:168px;object-fit:contain;margin:0 auto 14px;border-radius:16px;background:rgba(255,255,255,.96);padding:10px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
#loginScreen .loginArt{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#loginScreen .loginArt .float{position:absolute;opacity:.78;color:#0a3d62;font-size:36px;animation:floatY 2.8s ease-in-out infinite;filter:drop-shadow(0 2px 4px rgba(10,60,100,.35));text-shadow:0 1px 2px rgba(255,255,255,.6)}
#loginScreen .loginArt .float.s2{font-size:30px;opacity:.70;animation-duration:3.4s;animation-delay:-0.6s}
#loginScreen .loginArt .float.s3{font-size:42px;opacity:.75;animation-duration:2.2s;animation-delay:-1.1s}
@keyframes floatY{0%{transform:translateY(0) rotate(-4deg)}25%{transform:translateY(-28px) rotate(5deg)}50%{transform:translateY(8px) rotate(-3deg)}75%{transform:translateY(-20px) rotate(6deg)}100%{transform:translateY(0) rotate(-4deg)}}
#loginScreen .loginBox{position:relative;z-index:1}
.loginArt-ring{position:absolute;border:3px solid rgba(20,80,130,.28);border-radius:50%;animation:spinSlow 18s linear infinite}
@keyframes spinSlow{to{transform:rotate(360deg)}}
.loginArt-dna{position:absolute;width:120px;height:200px;opacity:.28}
.loginArt-dna::before,.loginArt-dna::after{content:'';position:absolute;left:50%;width:8px;height:100%;margin-left:-4px;background:repeating-linear-gradient(to bottom,rgba(15,70,120,.55) 0 10px,transparent 10px 22px);border-radius:4px}
.loginArt-dna::after{transform:skewX(18deg)}
.loginArt-dna::before{transform:skewX(-18deg)}
.loginBox h1{margin:0 0 4px;font-size:1.6rem;color:#0d3a5c;text-align:center}
.loginBox .sub{color:var(--muted);margin-bottom:22px}
.contactFooter{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.6}
.contactFooter a{color:var(--primary);font-weight:600;text-decoration:none}
.contactFooter a:hover{text-decoration:underline}
.teia-wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.teia-svg{background:#f0f7f2;border:1px solid var(--line);border-radius:10px;width:100%;max-width:360px;height:auto;display:block}
.teia-wrap{max-width:100%;overflow:hidden}
.teia-node{cursor:pointer}
.teia-node circle{fill:#d8f3dc;stroke:#2d6a4f;stroke-width:2;transition:.2s}
.teia-node text{font-size:11px;fill:#1b4332;pointer-events:none;font-weight:600}
.teia-node.on circle{fill:#2d6a4f;stroke:#1b4332}
.teia-node.on text{fill:#fff}
.teia-node.warn circle{fill:#fff3cd;stroke:#b8860b}
.sintoma-item{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-bottom:1px solid #eef2f0;font-size:12px}
.sintoma-item:hover{background:#f3faf5}
.sintoma-item input{margin-top:2px}
.chip{display:inline-block;background:#d8f3dc;color:#1b4332;border-radius:12px;padding:2px 8px;margin:2px;font-size:11px;font-weight:700}
.chip-warn{background:#fff3cd;color:#7a5b00}
.chip-bad{background:#f8d7da;color:#721c24}
.rx-preview{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px;max-width:800px}
.rx-preview .rx-head{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:3px solid var(--primary2);padding-bottom:10px;margin-bottom:14px}
.rx-preview .rx-head-left{display:flex;align-items:center;gap:12px;min-width:0}
.rx-preview .rx-logo{width:64px;height:64px;object-fit:contain;flex-shrink:0;border-radius:8px}
.rx-preview .brand{font-weight:800;font-size:17px;color:var(--primary2);line-height:1.25}
@media print{
  .rx-preview .rx-logo{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.rx-preview .rx-title{text-align:center;font-weight:800;color:var(--primary2);margin:12px 0;letter-spacing:.04em}
.rx-preview .rx-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;margin-bottom:12px}
.rx-preview .rx-section{margin:12px 0}
.rx-preview .rx-section h3{font-size:12px;text-transform:uppercase;color:var(--primary2);border-bottom:1px solid var(--line);padding-bottom:4px;margin:0 0 6px}
.rx-preview .rx-text{white-space:pre-wrap;font-size:13px;min-height:40px}
.rx-preview .sig-block{margin-top:28px;text-align:center;page-break-inside:avoid}
.rx-preview .sig-wrap{position:relative;width:260px;height:100px;margin:0 auto}
.rx-preview .sig-block .stamp-img{
  position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
  width:190px;max-width:95%;height:auto;max-height:95px;object-fit:contain;
  z-index:2;mix-blend-mode:multiply;pointer-events:none
}
.rx-preview .sig-block .sig-line{
  position:absolute;left:0;right:0;bottom:0;
  border-top:1px solid #222;height:0;z-index:1
}
.rx-preview .sig-label{margin-top:6px;font-size:11px;color:#444}
.rx-preview .disclaimer{margin-top:16px;border-left:4px solid #d3a52e;background:#fff9e8;padding:8px;font-size:10px;color:#594b28}
.rx-preview .legal-foot{margin-top:18px;font-size:9.5px;line-height:1.35;color:#444;text-align:justify;border-top:1px solid #ccc;padding-top:10px}
.rx-preview .rx-qr-wrap{display:flex;align-items:center;gap:14px;margin-top:12px;flex-wrap:wrap}
.rx-preview .rx-qr{width:96px;height:96px;object-fit:contain;border:1px solid #ddd;border-radius:8px;background:#fff}
.rx-preview .rx-qr-txt{font-size:11px;line-height:1.4;color:#333}
@media print{.rx-preview .rx-qr{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.rx-preview a{color:#1b4332;text-decoration:underline;word-break:break-all}
@page{size:A4 portrait;margin:12mm}
@media print{
  html,body{width:210mm;min-height:297mm;height:auto!important;margin:0!important;padding:0!important;background:#fff!important;overflow:visible!important}
  body *{visibility:hidden!important}
  #printArea, #printArea *{visibility:visible!important}
  #printArea{
    position:absolute;left:0;top:0;width:186mm;max-width:186mm;
    padding:12px;margin:0;box-sizing:border-box;
    background:#fff!important;border:0!important;box-shadow:none!important;border-radius:0!important;
    overflow:visible!important;height:auto!important;max-height:none!important
  }
  #printArea section,#printArea div,#printArea p,#printArea pre{overflow:visible!important;max-height:none!important}
  .no-print,.menubar,.topbar,.sidebar,.statusBar,#loginScreen,.toast,.gemini-log{display:none!important}
  .rx-preview .stamp-img{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .panel{box-shadow:none!important;border:0!important;background:#fff!important}
  body.print-content #content,
  body.print-content #content *{visibility:visible!important}
  body.print-content #content{
    position:absolute;left:0;top:0;width:186mm;padding:0;margin:0;height:auto!important;overflow:visible!important
  }
  body.print-content .no-print{display:none!important}
}
.loginBox label{display:block;font-weight:600;margin:12px 0 5px}
.loginBox input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px}
.loginBox .btn{margin-top:18px;width:100%;padding:11px;background:var(--primary);color:#fff;border:0;border-radius:6px;font-weight:700}
.loginBox .btn:hover{background:var(--primary2)}
.loginHint{margin-top:14px;font-size:12px;color:var(--muted);text-align:center}
.gemini-log{max-height:420px;overflow:auto;background:#f7fbf8;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.gemini-msg{margin:0 0 12px;padding:10px 12px;border-radius:8px;white-space:pre-wrap;line-height:1.45}
.gemini-msg.user{background:#e3f2e8;border:1px solid #c5dccb}
.gemini-msg.bot{background:#fff;border:1px solid var(--line)}
.gemini-msg .who{font-size:11px;font-weight:700;color:var(--primary2);margin-bottom:4px}
.gemini-msg.error{background:#fdecea;border-color:#f5c2c0;color:#721c24}

/* APP SHELL */
#app{display:none;height:100vh;flex-direction:column}
#app.on{display:flex}
.topbar{background:linear-gradient(90deg,#1b4332 0%,#2d6a4f 45%,#52b788 100%);color:#fff;display:flex;align-items:center;gap:16px;padding:0 12px;height:46px;flex-shrink:0}
.topbar .brand-wrap{display:flex;align-items:center;gap:8px;min-width:0}
.topbar .brand-logo{width:30px;height:30px;object-fit:contain;border-radius:5px;background:#fff;padding:2px}
.topbar .brand{font-weight:800;letter-spacing:.03em;font-size:16px}
.topbar .user{margin-left:auto;font-size:12px;opacity:.9}
.topbar button{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;padding:4px 10px;border-radius:4px}
.topbar button:hover{background:rgba(255,255,255,.12)}

/* MENU */
.menubar{background:var(--menu);color:#dce8f0;display:flex;flex-wrap:wrap;gap:2px;padding:0 6px;flex-shrink:0;border-bottom:1px solid #0a2030}
.menubar .m{position:relative}
.menubar .m>button{background:transparent;border:0;color:#dce8f0;padding:8px 12px;font-weight:600}
.menubar .m>button:hover,.menubar .m.open>button{background:var(--menuHover)}
.menubar .drop{display:none;position:absolute;top:100%;left:0;background:#fff;color:var(--text);min-width:220px;border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:50}
.menubar .m.open .drop{display:block}
.menubar .drop button{display:block;width:100%;text-align:left;padding:8px 14px;border:0;background:#fff;border-bottom:1px solid #eef2f5}
.menubar .drop button:hover{background:#e8f4fa}
.menubar .drop .sep{height:1px;background:var(--line);margin:4px 0}

/* BODY */
.main{flex:1;display:flex;overflow:hidden}
.sidebar{width:200px;background:#f4f7fa;border-right:1px solid var(--line);padding:10px;overflow:auto;flex-shrink:0}
.sidebar h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.sidebar button{display:block;width:100%;text-align:left;padding:8px 10px;margin-bottom:3px;border:1px solid transparent;background:transparent;border-radius:5px}
.sidebar button:hover,.sidebar button.active{background:#d6ebf5;border-color:#a8c8d8}
.content{flex:1;overflow:auto;padding:16px;background:#c8ccd0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.panel h2{margin:0 0 12px;font-size:1.15rem;color:var(--primary2);border-bottom:2px solid #d0e4ef;padding-bottom:8px}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px}
.field{flex:1;min-width:140px}
.field label{display:block;font-weight:600;margin-bottom:4px;color:var(--muted);font-size:12px}
.field input,.field select,.field textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:5px}
.field textarea{min-height:70px;resize:vertical}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{padding:7px 14px;border:1px solid var(--line);border-radius:5px;background:#f5f8fa;font-weight:600}
.btn:hover{background:#e4eef5}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary2)}
.btn-ok{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left}
th{background:#eef5f9;font-weight:700}
tr:nth-child(even){background:#fafcfd}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:#e3f2fa}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.badge-ok{background:#d4edda;color:var(--ok)}
.badge-warn{background:#fff3cd;color:var(--warn)}
.badge-bad{background:#f8d7da;color:var(--danger)}
.stat{display:inline-block;background:#eef6fb;border:1px solid #c5dde8;border-radius:6px;padding:8px 14px;margin:4px 6px 4px 0}
.stat b{display:block;font-size:1.2rem;color:var(--primary2)}
.diet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:12px}
.diet-card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.diet-card img{width:100%;height:160px;object-fit:cover;object-position:center center;display:block;background:#e8f0e8}
.diet-card .body{padding:12px 14px}
.diet-card h4{margin:0 0 6px;font-size:15px;color:var(--primary2)}
.diet-card p{margin:0;font-size:12.5px;color:#444;line-height:1.4}
.diet-tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;background:#e3f2e8;color:#1b4332;margin-bottom:6px}
.note-box{background:#fff9e8;border-left:4px solid #d3a52e;padding:10px 12px;font-size:12px;margin:12px 0;border-radius:0 8px 8px 0}
.sup-table td,.sup-table th{font-size:12px;vertical-align:top}

.toast{position:fixed;bottom:20px;right:20px;background:#1a2a35;color:#fff;padding:12px 18px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:100;opacity:0;transition:.3s}
.toast.show{opacity:1}
.statusBar{background:#dfe8ef;border-top:1px solid var(--line);padding:4px 12px;font-size:11px;color:var(--muted);flex-shrink:0}
@media(max-width:800px){
  .sidebar{display:none}
  .menubar{font-size:12px}
}
</style>
</head>

function ageFrom(nasc){
  if(!nasc) return '—';
  const d=new Date(nasc+'T00:00:00'); const n=new Date();
  let a=n.getFullYear()-d.getFullYear();
  const m=n.getMonth()-d.getMonth();
  if(m<0||(m===0&&n.getDate()<d.getDate())) a--;
  return a;
}
function imc(peso, altura){
  if(!peso||!altura||altura<=0) return null;
  return peso/(altura*altura);
}
function classIMC(v){
  if(v==null) return {t:'—', c:''};
  if(v<18.5) return {t:'Baixo peso', c:'badge-warn'};
  if(v<25) return {t:'Eutrófico', c:'badge-ok'};
  if(v<30) return {t:'Sobrepeso', c:'badge-warn'};
  return {t:'Obesidade', c:'badge-bad'};
}
function pesoIdeal(sexo, altura){
  // fórmula simplificada (Devine)
  if(!altura) return null;
  const pol = altura * 39.3701;
  if(sexo==='M') return 50 + 2.3*(pol-60);
  return 45.5 + 2.3*(pol-60);
}
function tmbMifflin(sexo, peso, alturaCm, idade){
  if(sexo==='M') return 10*peso + 6.25*alturaCm - 5*idade + 5;
  return 10*peso + 6.25*alturaCm - 5*idade - 161;
}
/** Harris-Benedict original (1919) */
function tmbHarris1919(sexo, peso, alturaCm, idade){
  if(sexo==='M') return 66.473 + 13.7516*peso + 5.0033*alturaCm - 6.755*idade;
  return 655.0955 + 9.5634*peso + 1.8496*alturaCm - 4.6756*idade;
}
/** Harris-Benedict revisada (Roza & Shizgal 1984) — a mais usada clinicamente como "HB atualizada" */
function tmbHarris1984(sexo, peso, alturaCm, idade){
  if(sexo==='M') return 88.362 + 13.397*peso + 4.799*alturaCm - 5.677*idade;
  return 447.593 + 9.247*peso + 3.098*alturaCm - 4.330*idade;
}
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

const LIMANET_API = (window.LIMANET_API_URL || 'https://limanet-api.onrender.com').replace(/\/$/, '');

async function doLogin(){
  const user = (document.getElementById('loginUser').value || '').trim();
  const pass = (document.getElementById('loginPass').value || '').trim();
  if (!user || !pass) { toast('Informe utilizador e senha'); return; }

  const btn = document.querySelector('#loginScreen .btn');
  if (btn) { btn.disabled = true; btn.textContent = 'A entrar…'; }

  try {
    const r = await fetch(LIMANET_API + '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user, pass })
    });
    let data = {};
    try { data = await r.json(); } catch (_) {}
    if (!r.ok || !data.ok) {
      toast((data && data.msg) || 'Utilizador ou senha inválidos');
      return;
    }
    sessionStorage.setItem('limanet_token', data.token);
    sessionStorage.setItem('limanet_nome', data.nome || '');
    sessionStorage.setItem('limanet_crn', data.crn || '');
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('app').classList.add('on');
    document.getElementById('lblUser').textContent = (data.nome || DB.user.nome) + ' · ' + (data.crn || DB.user.crn || '');
    showView('inicio');
    toast('Login realizado com sucesso!');
  } catch (e) {
    toast('Sem ligação ao servidor de login (Render). Verifique a URL LIMANET_API.');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Entrar'; }
  }
}
function doLogout(){
  sessionStorage.removeItem('limanet_token');
  sessionStorage.removeItem('limanet_nome');
  sessionStorage.removeItem('limanet_crn');
  // Segurança em computador partilhado: remove chave Gemini da memória do browser
  try { localStorage.removeItem('limanet_gemini_key'); } catch (_) {}
  const lbl = document.getElementById('lblUser');
  if (lbl) lbl.textContent = '';
  const u = document.getElementById('loginUser');
  const pw = document.getElementById('loginPass');
  if (u) u.value = '';
  if (pw) pw.value = '';
  // Limpa área visível da app (evita resquícios do utilizador anterior)
  const content = document.getElementById('content');
  if (content) content.innerHTML = '';
  document.getElementById('app').classList.remove('on');
  document.getElementById('loginScreen').classList.remove('hidden');
  toast('Sessão encerrada');
}

function editarPaciente(id){
  const p=DB.pacientes.find(x=>x.id===id); if(!p) return;
  selectedPacienteId=id;
  document.getElementById('pId').value=p.id;
  document.getElementById('pNome').value=p.nome;
  document.getElementById('pNasc').value=p.nasc||'';
  document.getElementById('pSexo').value=p.sexo||'F';
  document.getElementById('pPeso').value=p.peso??'';
  document.getElementById('pAltura').value=p.altura??'';
  document.getElementById('pTel').value=p.tel||'';
  document.getElementById('pEmail').value=p.email||'';

function salvarPaciente(){
  const nome=document.getElementById('pNome').value.trim();
  if(!nome){ toast('Informe o paciente!'); return; }
  const id=document.getElementById('pId').value;
  const data={
    nome, nasc:document.getElementById('pNasc').value,
    sexo:document.getElementById('pSexo').value,
    peso:parseFloat(document.getElementById('pPeso').value)||null,
    altura:parseFloat(document.getElementById('pAltura').value)||null,
    tel:document.getElementById('pTel').value,
    email:document.getElementById('pEmail').value,
    obs:document.getElementById('pObs').value
  };
  if(id){
    const p=DB.pacientes.find(x=>x.id==id);
    Object.assign(p, data);
    toast('Paciente atualizado!');
  } else {
    data.id=DB.seq.pac++;
    DB.pacientes.push(data);

}

function abrirFichaAnamneseCompleta(){
  let html = ANAMNESE_FICHA_HTML;
  try {
    const id = +((document.getElementById('anPac')||{}).value || selectedPacienteId || 0);
    const pac = DB.pacientes.find(p => p.id === id);
    if (pac && pac.nome) {
      // preenche nome se o campo existir
      html = html.replace(
        'id="nome" name="nome" class="input-nome">',
        'id="nome" name="nome" class="input-nome" value="'+String(pac.nome).replace(/"/g,'&quot;')+'">'
      );
      if (pac.nasc) {
        html = html.replace(
          'id="nascimento" name="nascimento" class="input-data">',
          'id="nascimento" name="nascimento" class="input-data" value="'+pac.nasc+'">'
        );
      }
      if (pac.sexo === 'F' || pac.sexo === 'M') {
        const v = pac.sexo;
        html = html.replace(
          'id="sexo_'+v.toLowerCase()+'" name="sexo" value="'+v+'">',
          'id="sexo_'+v.toLowerCase()+'" name="sexo" value="'+v+'" checked>'
        );
      }
    }
  } catch (e) {}
  const w = window.open('', '_blank');
  if (!w) { toast('Permita pop-ups para abrir a ficha'); return; }
  w.document.open();
  w.document.write(html);
  w.document.close();
}

function calcAntropometria(){
  const pac=DB.pacientes.find(p=>p.id==+$('#antPac').value);
  const peso=parseFloat($('#antPeso').value);
  const alt=parseFloat($('#antAlt').value);
  const cint=parseFloat($('#antCint').value);
  const quad=parseFloat($('#antQuad').value);
  const v=imc(peso,alt);
  const cl=classIMC(v);
  const idade=ageFrom(pac&&pac.nasc);
  const pi=pesoIdeal(pac&&pac.sexo, alt);
  let rcq='—';
  if(cint&&quad&&quad>0) rcq=(cint/quad).toFixed(2);
  $('#antResult').innerHTML=`
    <span class="stat"><b>${v?v.toFixed(1):'—'}</b>IMC <span class="badge ${cl.c}">${cl.t}</span></span>
    <span class="stat"><b>${pi?pi.toFixed(1)+' kg':'—'}</b>Peso ideal (est.)</span>
    <span class="stat"><b>${rcq}</b>RCQ</span>
    <span class="stat"><b>${idade}</b>Idade (anos)</span>
    <p style="margin-top:10px;color:var(--muted)">Classificação IMC (OMS adultos): &lt;18,5 baixo peso · 18,5–24,9 eutrófico · 25–29,9 sobrepeso · ≥30 obesidade.</p>`;
}
function salvarAntropometria(){
  const p=DB.pacientes.find(x=>x.id==+$('#antPac').value);

function calcEnergia(){
  const pac=DB.pacientes.find(p=>p.id==+$('#enPac').value);
  const peso=parseFloat($('#enPeso').value);
  const alt=parseFloat($('#enAlt').value);
  const fat=parseFloat($('#enFat').value);
  const pctG=parseFloat(($('#enPctG')||{}).value);
  if(!pac||!peso||!alt){ toast('Informe peso e altura!'); return; }
  const idade=ageFrom(pac.nasc); if(typeof idade!=='number'){ toast('Informe nascimento do paciente'); return; }
  const h=alt*100;
  const tmbM=tmbMifflin(pac.sexo, peso, h, idade);
  const tmbHB84=tmbHarris1984(pac.sexo, peso, h, idade);
  let tmbKM=null, getKM=null, lbm=null;
  if(!isNaN(pctG) && pctG>=0 && pctG<70){
    lbm=peso*(1-pctG/100);
    tmbKM=370+21.6*lbm; // Katch-McArdle
    getKM=tmbKM*fat;
  }
  const getM=tmbM*fat, getHB84=tmbHB84*fat;
  const protMin=peso*0.8, protMax=peso*1.2;
  const agua=peso*35;
  const sexoLbl=pac.sexo==='M'?'Masculino':'Feminino';
  $('#enResult').innerHTML=`
    <p style="margin:0 0 8px"><b>Sexo:</b> ${sexoLbl} · <b>Idade:</b> ${idade} a · <b>Fator:</b> ${fat}</p>
    <table style="margin-bottom:12px">
      <thead><tr><th>Fórmula</th><th>TMB (kcal)</th><th>GET (kcal)</th></tr></thead>
      <tbody>
        <tr><td>Mifflin-St Jeor (1990)</td><td><b>${Math.round(tmbM)}</b></td><td><b>${Math.round(getM)}</b></td></tr>
        <tr><td>Harris-Benedict revisada (Roza 1984)</td><td><b>${Math.round(tmbHB84)}</b></td><td><b>${Math.round(getHB84)}</b></td></tr>
        <tr><td>Katch-McArdle ${tmbKM?`(MLG ${lbm.toFixed(1)} kg)`:'(% gordura não informado)'}</td>
          <td>${tmbKM?`<b>${Math.round(tmbKM)}</b>`:'—'}</td>
          <td>${getKM?`<b>${Math.round(getKM)}</b>`:'—'}</td></tr>
      </tbody>
    </table>
    <span class="stat"><b>${protMin.toFixed(0)}–${protMax.toFixed(0)} g</b>Proteína/dia (est.)</span>
    <span class="stat"><b>${Math.round(agua)} ml</b>Água/dia (est. 35 ml/kg)</span>
    <p style="margin-top:10px;color:var(--muted)">
      <b>HB 1984 ♂:</b> 88,362 + 13,397×P + 4,799×A − 5,677×I &nbsp;·&nbsp;
      <b>♀:</b> 447,593 + 9,247×P + 3,098×A − 4,330×I<br>
      <b>Katch-McArdle:</b> 370 + 21,6 × massa magra (kg). Informe o % de gordura (bioimpedância) para calcular.
    </p>`;
}


const DIAS_PLANO = [
  {id:'seg', label:'Segunda'},
  {id:'ter', label:'Terça'},
  {id:'qua', label:'Quarta'},
  {id:'qui', label:'Quinta'},
  {id:'sex', label:'Sexta'},
  {id:'sab', label:'Sábado'},
  {id:'dom', label:'Domingo'}
];
const REF_PLANO = {cafe:'Café da manhã',lanche1:'Lanche da manhã',almoco:'Almoço',lanche2:'Lanche da tarde',jantar:'Jantar',ceia:'Ceia'};
function emptyRefeicoes(){
  return {cafe:[],lanche1:[],almoco:[],lanche2:[],jantar:[],ceia:[]};
}
function emptySemana(){
  const s={};
  DIAS_PLANO.forEach(d=>{ s[d.id]=emptyRefeicoes(); });
  return s;
}
/** Migra plano antigo {refeicoes:{}} para {semana:{seg:...,...}, dia:'seg'} */
function normalizePlano(plano){
  if(!plano) plano={};
  if(plano.semana && typeof plano.semana==='object'){
    DIAS_PLANO.forEach(d=>{
      if(!plano.semana[d.id]) plano.semana[d.id]=emptyRefeicoes();
      const r=plano.semana[d.id];
      Object.keys(REF_PLANO).forEach(k=>{ if(!Array.isArray(r[k])) r[k]=[]; });
    });
  } else {
    const base = (plano.refeicoes && typeof plano.refeicoes==='object')
      ? JSON.parse(JSON.stringify(plano.refeicoes))
      : emptyRefeicoes();
    Object.keys(REF_PLANO).forEach(k=>{ if(!Array.isArray(base[k])) base[k]=[]; });
    plano.semana = emptySemana();
    // copia o cardápio antigo para todos os dias (ponto de partida)
    DIAS_PLANO.forEach(d=>{ plano.semana[d.id]=JSON.parse(JSON.stringify(base)); });
  }
  if(!plano.dia || !DIAS_PLANO.some(d=>d.id===plano.dia)) plano.dia='seg';
  // espelho legado
  plano.refeicoes = plano.semana[plano.dia];
  return plano;
}
function getPlanoPaciente(id){
  if(!DB.planos) DB.planos={};
  const key=String(id);
  let plano=DB.planos[key]||DB.planos[+id]||window._planoTmp||{};
  plano=normalizePlano(plano);
  DB.planos[key]=plano;
  window._planoTmp=plano;
  return plano;
}
function totaisRefeicoes(refMap){
  let totais={kcal:0,prot:0,carb:0,lip:0};
  Object.values(refMap||{}).forEach(arr=>(arr||[]).forEach(item=>{
    const a=DB.alimentos.find(x=>x.id===item.alimId); if(!a) return;
    const q=item.qtd||1;
    totais.kcal+=a.kcal*q; totais.prot+=a.prot*q;
    totais.carb+=a.carb*q; totais.lip+=a.lip*q;
  }));
  return totais;
}

      }).join('')}
    </div>
  </div>
  ${Object.keys(REF_PLANO).map(ref=>`
  <div class="panel">

      <tbody>${linhas(ref)||'<tr><td colspan="6">Nenhum item</td></tr>'}</tbody>

  `;
  window._planoTmp=plano;
}

function gerarPdfPlanoSemanal(){
  const plPac=document.getElementById('plPac');
  const id=String(plPac?plPac.value:(selectedPacienteId||''));
  if(!id){ toast('Selecione o paciente'); return; }
  const pac=DB.pacientes.find(p=>String(p.id)===id);
  const plano=(DB.planos&&(DB.planos[id]||DB.planos[+id]))||window._planoTmp;
  if(!plano||!plano.refeicoes){ toast('Monte e salve o plano antes de gerar o PDF'); return; }
  const planoN=normalizePlano(plano);
  const refNomes=REF_PLANO;
  function itensDeDia(refMap){
    const blocos=[];
    let kcalDia=0, protDia=0;
    Object.keys(refNomes).forEach(function(ref){
      const arr=(refMap&&refMap[ref])||[];
      if(!arr.length) return;
      const linhas=arr.map(function(item){
        const a=DB.alimentos.find(x=>x.id===item.alimId);
        if(!a) return null;
        const q=item.qtd||1;
        const kcal=(a.kcal||0)*q;
        const prot=(a.prot||0)*q;
        const g=a.gramas!=null?(a.gramas*q):null;
        kcalDia+=kcal; protDia+=prot;
        return {
          nome:a.nome,
          medida:q+' '+((a.medida||'porção')+(q>1&&a.medida&&!/s$/i.test(a.medida)?'s':'')),
          gramas:g!=null?Math.round(g)+' g':'—',
          kcal:Math.round(kcal)
        };
      }).filter(Boolean);
      if(linhas.length) blocos.push({ref:refNomes[ref], linhas:linhas});
    });
    return {blocos:blocos, kcalDia:Math.round(kcalDia), protDia:protDia.toFixed(1)};
  }
  const porDia=DIAS_PLANO.map(function(d){
    return {id:d.id, label:d.label, data:itensDeDia(planoN.semana[d.id])};
  });
  if(!porDia.some(function(d){ return d.data.blocos.length; })){
    toast('Adicione alimentos ao plano antes de gerar o PDF'); return;
  }

  const diasHtml=porDia.map(function(d){
    const n=d.data.blocos.reduce(function(s,b){ return s+b.linhas.length; },0);
    const resumo=d.data.blocos.length
      ? d.data.blocos.map(function(b){ return b.ref+': '+b.linhas.map(function(L){ return L.nome; }).slice(0,2).join(', '); }).slice(0,2).join(' · ')
      : 'Sem itens';
    return '<div class="dia-row"><div class="dia-nome">'+d.label+'</div><div class="dia-desc">'+resumo+(n>2?'…':'')+' · <b>'+d.data.kcalDia+' kcal</b></div></div>';
  }).join('');

  let detalheHtml='';
  porDia.forEach(function(d){
    if(!d.data.blocos.length) return;
    detalheHtml+='<div class="ref-block"><div class="ref-title">'+d.label+' · '+d.data.kcalDia+' kcal · P '+d.data.protDia+' g</div>';
    d.data.blocos.forEach(function(b){
      detalheHtml+='<div style="font-weight:700;font-size:10px;margin:4px 0 2px;color:#2d6a4f">'+b.ref+'</div><ul>';
      b.linhas.forEach(function(L){
        detalheHtml+='<li><b>'+L.nome+'</b> — '+L.medida+' ('+L.gramas+') · <span class="kcal">'+L.kcal+' kcal</span></li>';
      });
      detalheHtml+='</ul>';
    });
    detalheHtml+='</div>';
  });

  const mediaKcal=Math.round(porDia.reduce(function(s,d){ return s+d.data.kcalDia; },0)/7);
  const mediaProt=(porDia.reduce(function(s,d){ return s+parseFloat(d.data.protDia); },0)/7).toFixed(1);
  const dia={ kcalDia:mediaKcal, protDia:mediaProt };

  const logoSrc=(document.querySelector('.brand-logo')&&document.querySelector('.brand-logo').src)||'';
  const html=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Cardápio semanal — ${(pac&&pac.nome)||'Paciente'}</title>

function exportBackup(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='limanet-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  toast('Backup realizado com sucesso!');
}
function importBackup(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      DB=JSON.parse(r.result); saveDB();
      toast('Restauração do backup realizada com sucesso!');
      showView('inicio');
    }catch(e){ toast('Arquivo de backup inválido'); }
  };
  r.readAsText(f);
}

    <h2>Referência rápida — ganho de peso (IOM)</h2>
    <table>
      <thead><tr><th>IMC pré-gestacional</th><th>Classificação</th><th>Ganho total recomendado</th><th>Ganho semanal (2º/3º tri)</th></tr></thead>
      <tbody>
        <tr><td>&lt; 18,5</td><td>Baixo peso</td><td>12,5 – 18 kg</td><td>0,44 – 0,58 kg/sem</td></tr>
        <tr><td>18,5 – 24,9</td><td>Eutrófico</td><td>11,5 – 16 kg</td><td>0,35 – 0,50 kg/sem</td></tr>
        <tr><td>25 – 29,9</td><td>Sobrepeso</td><td>7 – 11,5 kg</td><td>0,23 – 0,33 kg/sem</td></tr>
        <tr><td>≥ 30</td><td>Obesidade</td><td>5 – 9 kg</td><td>0,17 – 0,27 kg/sem</td></tr>
      </tbody>
    </table>
    <p style="color:var(--muted);margin-top:10px">Energia adicional típica: ~+0 kcal (1º tri) · +340 kcal (2º) · +452 kcal (3º) sobre a necessidade pré-gestacional (IOM). Ajuste clínico individual.</p>
  </div>`;
}
function calcGestante(){
  const pesoPre=parseFloat($('#gPesoPre').value);
  const pesoAt=parseFloat($('#gPesoAt').value);
  const alt=parseFloat($('#gAlt').value);
  const ig=parseFloat($('#gIG').value)||0;
  const trim=+$('#gTrim').value;
  const au=parseFloat($('#gAU').value);
  if(!pesoPre||!alt){ toast('Informe peso pré-gestacional e altura!'); return; }
  const imcPre=pesoPre/(alt*alt);
  let faixa='Eutrófico', ganhoMin=11.5, ganhoMax=16, semMin=0.35, semMax=0.50;
  if(imcPre<18.5){ faixa='Baixo peso'; ganhoMin=12.5; ganhoMax=18; semMin=0.44; semMax=0.58; }
  else if(imcPre<25){ faixa='Eutrófico'; ganhoMin=11.5; ganhoMax=16; semMin=0.35; semMax=0.50; }
  else if(imcPre<30){ faixa='Sobrepeso'; ganhoMin=7; ganhoMax=11.5; semMin=0.23; semMax=0.33; }
  else { faixa='Obesidade'; ganhoMin=5; ganhoMax=9; semMin=0.17; semMax=0.27; }
  const ganhoAtual=(pesoAt&&pesoPre)?(pesoAt-pesoPre):null;
  const extra={1:0,2:340,3:452}[trim]||0;
  // TMB pré como base (aprox. mulher)
  const idade=ageFrom(DB.pacientes.find(p=>p.id==+$('#gPac').value)?.nasc);
  let tmbBase=null, getGest=null;
  if(typeof idade==='number' && pesoPre && alt){
    tmbBase=tmbMifflin('F', pesoPre, alt*100, idade);
    getGest=tmbBase*1.375+extra; // atividade leve + adicional gestacional
  }
  // Altura uterina esperada ~ IG em cm após 20 sem (regra prática)
  let auMsg='';
  if(au && ig>=20){
    const esp=ig;
    const dif=au-esp;
    if(Math.abs(dif)<=2) auMsg='Altura uterina compatível com a IG (±2 cm).';
    else if(dif>2) auMsg='Altura uterina acima do esperado para a IG — avaliar clinicamente.';
    else auMsg='Altura uterina abaixo do esperado para a IG — avaliar clinicamente.';
  }
  $('#gResult').innerHTML=`
    <span class="stat"><b>${imcPre.toFixed(1)}</b>IMC pré-gestacional · ${faixa}</span>
    <span class="stat"><b>${ganhoMin} – ${ganhoMax} kg</b>Ganho total IOM</span>
    <span class="stat"><b>${semMin} – ${semMax} kg</b>/semana (2º–3º tri)</span>
    ${ganhoAtual!=null?`<span class="stat"><b>${ganhoAtual>=0?'+':''}${ganhoAtual.toFixed(1)} kg</b>Ganho até agora (IG ${ig} sem)</span>`:''}
    <span class="stat"><b>+${extra} kcal</b>Adicional energético (${trim}º tri)</span>
    ${getGest?`<span class="stat"><b>${Math.round(getGest)} kcal</b>GET gestacional (est.)</span>`:''}
    ${auMsg?`<p style="margin-top:10px">${auMsg}</p>`:''}
    <p style="margin-top:8px;color:var(--muted)">Valores de referência IOM. Conduta final é clínica e individualizada (gemelaridade, patologias, adolescente).</p>`;
}

function importarTextoExames(){
  const ta = document.getElementById('exImport');
  let txt = (ta && ta.value) || '';
  if (!txt.trim()) { toast('Cole o texto do laudo primeiro'); return; }
  // normaliza acentos e espaços para facilitar o match
  const norm = txt
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\u00a0/g, ' ')
    .replace(/[–—]/g, '-')
    .replace(/\s+/g, ' ');
  const num = '(\\d{1,3}(?:[.]\\d{3})*(?:[,.]\\d+)?|\\d+[,.]\\d+|\\d+)';
  const mapa = [
    [new RegExp('hemacias?[^\\d]{0,25}' + num, 'i'), 'hemacias'],
    [new RegExp('(?:^|[^a-z])hemoglobina(?!\\s+globular)(?!\\s+glic)[^\\d]{0,25}' + num, 'i'), 'hb'],
    [new RegExp('hematocrit[oa]?[^\\d]{0,25}' + num, 'i'), 'ht'],
    [new RegExp('(?:hemoglobina\\s+globular\\s+media|\\bhgm\\b|\\bhcm\\b)[^\\d]{0,25}' + num, 'i'), 'hcm'],
    [new RegExp('(?:volume\\s+globular\\s+medio|\\bvcm\\b)[^\\d]{0,25}' + num, 'i'), 'vcm'],
    [new RegExp('(?:con\\.?\\s*hemoglobina\\s+globular\\s+media|\\bchgm\\b|\\bchcm\\b)[^\\d]{0,25}' + num, 'i'), 'chcm'],
    [new RegExp('(?:indice\\s+de\\s+anisocitose|\\brdw\\b)[^\\d]{0,25}' + num, 'i'), 'rdw'],
    [new RegExp('leuc[o]?citos?\\s*(?:totais)?[^\\d]{0,25}' + num, 'i'), 'leu'],
    [new RegExp('basofilos?[^\\d]{0,12}' + num, 'i'), 'baso_pct'],
    [new RegExp('basofilos?[^|\\n]{0,50}\\|\\s*' + num, 'i'), 'baso_abs'],
    [new RegExp('eosinofilos?[^\\d]{0,12}' + num, 'i'), 'eos_pct'],
    [new RegExp('eosinofilos?[^|\\n]{0,50}\\|\\s*' + num, 'i'), 'eos_abs'],
    [new RegExp('mielocitos?[^\\d]{0,20}' + num, 'i'), 'miel'],
    [new RegExp('metamielocitos?[^\\d]{0,20}' + num, 'i'), 'meta'],
    [new RegExp('basto(?:es|nates)?[^\\d]{0,12}' + num, 'i'), 'bast_pct'],
    [new RegExp('basto(?:es|nates)?[^|\\n]{0,40}\\|\\s*' + num, 'i'), 'bast_abs'],
    [new RegExp('segmentados?[^\\d]{0,12}' + num, 'i'), 'seg_pct'],
    [new RegExp('segmentados?[^|\\n]{0,55}' + num, 'i'), 'seg_abs'],
    [new RegExp('linfocitos?[^\\d]{0,12}' + num, 'i'), 'linf_pct'],
    [new RegExp('linfocitos?[^|\\n]{0,50}\\|\\s*' + num, 'i'), 'linf_abs'],
    [new RegExp('monocitos?[^\\d]{0,12}' + num, 'i'), 'mono_pct'],
    [new RegExp('monocitos?[^|\\n]{0,50}\\|\\s*' + num, 'i'), 'mono_abs'],
    [new RegExp('plaquetas?[^\\d]{0,25}' + num, 'i'), 'plaq'],
    [new RegExp('(?:\\bvpm\\b|volume\\s+plaquetario)[^\\d]{0,25}' + num, 'i'), 'vpm'],
    [new RegExp('reticulocitos?[^\\d]{0,25}' + num, 'i'), 'retic'],
    [new RegExp('ferritin[ae]?[^\\d]{0,25}' + num, 'i'), 'ferritina'],
    [new RegExp('ferro\\s*s[e]?ric[oa]?[^\\d]{0,25}' + num, 'i'), 'ferro'],
    [new RegExp('(?:vitamina\\s*d|25\\s*-?\\s*oh|25ohd)[^\\d]{0,30}' + num, 'i'), 'vitd'],
    [new RegExp('(?:vitamina\\s*b\\s*12|cobalamina)[^\\d]{0,25}' + num, 'i'), 'b12'],
    [new RegExp('(?:acido\\s+folico|folato)[^\\d]{0,25}' + num, 'i'), 'folato'],
    [new RegExp('glicose[^\\d]{0,30}' + num, 'i'), 'glicose'],
    [new RegExp('(?:hba1c|hemoglobina\\s+glic)[^\\d]{0,25}' + num, 'i'), 'hba1c'],
    [new RegExp('colesterol\\s+total[^\\d]{0,25}' + num, 'i'), 'ct'],
    [new RegExp('\\bldl\\b[^\\d]{0,20}' + num, 'i'), 'ldl'],
    [new RegExp('\\bhdl\\b[^\\d]{0,20}' + num, 'i'), 'hdl'],
    [new RegExp('triglicer[^\\d]{0,25}' + num, 'i'), 'tg'],
    [new RegExp('\\btsh\\b[^\\d]{0,20}' + num, 'i'), 'tsh'],
    [new RegExp('albumin[ae]?[^\\d]{0,25}' + num, 'i'), 'albumina'],
    [new RegExp('(?:\\bpcr\\b|proteina\\s+c\\s*reativa)[^\\d]{0,25}' + num, 'i'), 'pcr'],
    [new RegExp('creatinin[ae]?[^\\d]{0,25}' + num, 'i'), 'creatinina'],
    [new RegExp('(?:%\\s*gordura|gordura\\s*corporal|fat\\s*%)[^\\d]{0,20}' + num, 'i'), 'bioGord'],
    [new RegExp('(?:massa\\s+magra|fat\\s*-?free)[^\\d]{0,20}' + num, 'i'), 'bioMM'],
    [new RegExp('(?:agua\\s+corporal|body\\s+water)[^\\d]{0,20}' + num, 'i'), 'bioAgua'],
    [new RegExp('(?:angulo\\s+de\\s+fase|phase\\s+angle)[^\\d]{0,20}' + num, 'i'), 'bioAF']
  ];
  function limparNum(s){
    s = String(s).trim();
    // milhares estilo BR 7.350 → 7350; decimal 10,8 → 10.8
    if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) {
      s = s.replace(/\./g, '').replace(',', '.');
    } else if (s.indexOf(',') >= 0 && s.indexOf('.') < 0) {
      s = s.replace(',', '.');
    }
    return s;
  }
  let n = 0;
  const achados = [];
  mapa.forEach(function(pair){
    const re = pair[0], id = pair[1];
    const m = norm.match(re);
    if (!m) return;
    const val = limparNum(m[1]);
    const el = document.getElementById(id.indexOf('bio') === 0 ? id : ('ex_' + id));
    if (el) { el.value = val; n++; achados.push(id + '=' + val); }
  });
  // Hematoscopia / morfologia → observações
  const hemato = txt.match(/hematoscopia\s*[:\-–]?\s*([^\n\r]+)/i);
  if (hemato) {
    const obs = document.getElementById('exObs');
    if (obs) {
      const extra = 'Hematoscopia: ' + hemato[1].trim();
      obs.value = (obs.value ? obs.value + '\n' : '') + extra;
    }
  }
  toast(n ? ('Importados ' + n + ' valores: ' + achados.slice(0, 8).join(', ') + (achados.length > 8 ? '…' : '')) : 'Nenhum valor reconhecido — preencha manualmente');
}
function salvarExames(){
  const id=$('#exPac').value;
  if(!id){ toast('Informe o paciente!'); return; }
  const valores={};
  EXAMES_PADRAO.forEach(e=>{
    const v=document.getElementById('ex_'+e.id).value.trim();
    if(v!=='') valores[e.id]=v;
  });
  const bio={
    gordura:$('#bioGord').value, massaMagra:$('#bioMM').value,
    agua:$('#bioAgua').value, tmb:$('#bioTmb').value, angulo:$('#bioAF').value
  };
  if(!DB.exames) DB.exames={};
  const kid = String(id);
  DB.exames[kid]={ data:$('#exData').value, valores, bio, obs:$('#exObs').value };
  // alias numérico para leituras antigas
  if (String(+id) === kid) DB.exames[+id] = DB.exames[kid];
  saveDB(); toast('Exames e bioimpedância salvos! Use o Gemini com este paciente selecionado.');
}

      ${SINTOMAS_MICRO.map((s,i)=>`
        <label class="sintoma-item">
          <input type="checkbox" class="ckSint" data-i="${i}" ${marcados.has(i)?'checked':''} onchange="toggleSintomaTeia(${i},this.checked)">
          <span><b>${esc(s.t)}</b><br><span style="color:var(--muted)">${esc(s.n)}</span></span>
        </label>`).join('')}
    </div>
    <div class="field" style="margin-top:12px"><label for="teiaHipot">Deficiências / hipóteses encontradas (texto livre)</label>
        <textarea id="teiaHipot">${esc(dados.hipotese||'')}</textarea>
    </div>
    <div class="btns">
      <button class="btn btn-primary" onclick="salvarTeia()">Salvar teia e checklist</button>
      <button class="btn" onclick="imprimirA4()">Imprimir</button>
    </div>
  </div>`;
  window._teiaEixos=eixosOn;
  window._teiaSint=marcados;
}
function toggleSintomaTeia(i, on){
  if(!window._teiaSint) window._teiaSint=new Set();
  if(on) window._teiaSint.add(i); else window._teiaSint.delete(i);
}
function toggleEixoTeia(id){
  if(!window._teiaEixos) window._teiaEixos=new Set();
  if(window._teiaEixos.has(id)) window._teiaEixos.delete(id);
  else window._teiaEixos.add(id);
  // refresh visual only for nodes
  document.querySelectorAll('.teia-node').forEach(g=>{
    g.classList.toggle('on', window._teiaEixos.has(g.getAttribute('data-eixo')));
  });
}
function salvarTeia(){
  const id=$('#teiaPac').value;
  if(!id){ toast('Informe o paciente!'); return; }
  if(!DB.teia) DB.teia={};
  // merge eixos from symptoms
  const eixos=new Set(window._teiaEixos||[]);
  (window._teiaSint||[]).forEach(i=>{
    const s=SINTOMAS_MICRO[i]; if(s) (s.eixos||[]).forEach(e=>eixos.add(e));
  });
  DB.teia[id]={
    sintomas:[...(window._teiaSint||[])],
    eixos:[...eixos],
    hipotese:$('#teiaHipot').value,
    atualizado:new Date().toISOString().slice(0,10)
  };
  saveDB(); toast('Teia e checklist salvos!'); showView('teia');
}

function dietCard(tag, title, img, text, pos){
  const ph = 'data:image/svg+xml,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280">' +
    '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
    '<stop stop-color="#2d6a4f"/><stop offset="1" stop-color="#95d5b2"/></linearGradient></defs>' +
    '<rect width="100%" height="100%" fill="url(#g)"/>' +
    '<text x="50%" y="54%" text-anchor="middle" fill="white" font-size="28" font-family="Arial,sans-serif">Limanet</text></svg>'
  );
  const op = pos || 'center center';
  return `<div class="diet-card">
    <img src="${img}" alt="${esc(title)}" loading="lazy" referrerpolicy="no-referrer"
      style="object-position:${op}"
      onerror="this.onerror=null;this.src='${ph}'">
    <div class="body"><span class="diet-tag">${esc(tag)}</span><h4>${esc(title)}</h4><p>${text}</p></div>
  </div>`;
}

function fillFitoPatient(){
  const id=+(document.getElementById('ftPac')||{}).value||selectedPacienteId;
  const pac=DB.pacientes.find(p=>p.id===id);
  if(!pac) return;

function splitPlantName(full){
  const s = (full || '').trim();
  if (!s) return { popular: '', cientifico: '' };
  // formatos: "Popular — Científico" ou "Popular - Científico" ou "Popular (Científico)"
  let m = s.split(/\s+[—–-]\s+/);
  if (m.length >= 2) return { popular: m[0].trim(), cientifico: m.slice(1).join(' — ').trim() };
  m = s.match(/^(.+?)\s*\(([^)]+)\)\s*$/);
  if (m) return { popular: m[1].trim(), cientifico: m[2].trim() };
  return { popular: s, cientifico: '' };
}
function loadFitoPlant(){
  const id=(document.getElementById('ftPlant')||{}).value;
  const p=PLANTS_FITO.find(x=>x.id===id)||PLANTS_FITO[0];
  if(!p) return;
  const set=(i,v)=>{const el=document.getElementById(i); if(el) el.value=v;};
  const parts = splitPlantName(p.name);
  set('ftName', parts.popular);
  set('ftSci', parts.cientifico);
  // Garante nome + científico no início da prescrição
  let formTxt = p.form || '';
  const header = [parts.popular, parts.cientifico ? '(' + parts.cientifico + ')' : ''].filter(Boolean).join(' ');
  if (header && formTxt && !formTxt.toLowerCase().includes((parts.popular||'').toLowerCase().slice(0,8))) {
    formTxt = header + '. ' + formTxt;
  } else if (header && !formTxt) {
    formTxt = header;
  }
  set('ftForm', formTxt);
  set('ftDose', p.dose);
  set('ftQty', p.quantity);
  set('ftCaut', p.caution);
  set('ftInd', p.indication);
  renderFitoPreview();
  toast('Dados da planta carregados: ' + (parts.popular || p.name));
}

function renderPedidoExames(){
  const id=+(document.getElementById('rxPac')||{}).value;
  const pac=DB.pacientes.find(p=>p.id===id);
  const d=(document.getElementById('rxDate')||{}).value||'';
  let dPt=d; if(d.includes('-')){const p=d.split('-'); dPt=p[2]+'/'+p[1]+'/'+p[0];}
  const nasc=pac&&pac.nasc?(()=>{const p=pac.nasc.split('-');return p[2]+'/'+p[1]+'/'+p[0];})():'—';
  const checks=[...document.querySelectorAll('.rxExCk:checked')].map(x=>x.value);
  const outros=(document.getElementById('rxOutros')||{}).value||'';
  document.getElementById('rxpPac').textContent=pac?pac.nome:'—';
  document.getElementById('rxpDate').textContent=dPt||'—';
  document.getElementById('rxpNasc').textContent=nasc;
  document.getElementById('rxpSexo').textContent=pac?(pac.sexo==='M'?'Masculino':'Feminino'):'—';
  document.getElementById('rxpLista').textContent=checks.length?checks.map((x,i)=>(i+1)+'. '+x).join('\n'):'—';
  document.getElementById('rxpObs').textContent=outros||'Seguir orientações de preparo do laboratório.';
}

      <button type="button" class="btn" id="gemPrint">Baixar PDF</button>
      <button type="button" class="btn" id="gemClear">Limpar</button>
      <button type="button" class="btn" onclick="showView('config')">Configurar chave API</button>
    </div>
    <p style="font-size:11px;color:var(--muted);margin-top:10px">Modelo: gemini-2.5-flash · chave: ${key ? 'configurada neste navegador' : '<b style="color:var(--danger)">não configurada</b>'}</p>
  </div>`;
  document.getElementById('gemSend').onclick = enviarGemini;
  document.getElementById('gemPrint').onclick = imprimirGemini;
  document.getElementById('gemClear').onclick = () => {
    document.getElementById('gemLog').innerHTML = '<div class="gemini-msg bot"><div class="who">Gemini</div>Olá. Em que posso ajudar na consulta?</div>';
    document.getElementById('gemPrompt').value = '';
  };
  document.getElementById('gemPrompt').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) enviarGemini();
  });
}
function loadJsPdfLib(){
  if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  return new Promise(function(resolve, reject){
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.onload = function(){
      if (window.jspdf && window.jspdf.jsPDF) resolve(window.jspdf.jsPDF);
      else reject(new Error('jsPDF não carregou'));
    };
    s.onerror = function(){ reject(new Error('Falha ao carregar jsPDF (rede/CDN)')); };
    document.head.appendChild(s);
  });
}
function imprimirGemini(){
  baixarPdfGemini();
}
async function baixarPdfGemini(){
  const log = document.getElementById('gemLog');
  if (!log) { toast('Nada para exportar'); return; }

  const blocks = [...log.querySelectorAll('.gemini-msg')];
  const fullText = (log.innerText || '').trim();
  if (!blocks.length && !fullText) { toast('Nada para exportar'); return; }

  const pacSel = document.getElementById('gemPac');
  const pacTxt = pacSel && pacSel.value ? ((pacSel.options[pacSel.selectedIndex] || {}).text || '') : '';
  const when = new Date().toLocaleString('pt-BR');
  const prof = (DB.user && DB.user.nome) || '';
  const crn = (DB.user && DB.user.crn) || '';

  const parts = [];
  if (blocks.length) {
    blocks.forEach(el => {
      const whoEl = el.querySelector('.who');
      const who = (whoEl && whoEl.textContent || '').trim() || 'Mensagem';
      let text = (el.textContent || '');
      if (who && text.startsWith(who)) text = text.slice(who.length);
      text = text.replace(/^\s+/, '').trim();
      if (!text || /^A processar/i.test(text)) return;
      parts.push({ who: who, text: text });
    });
  }
  if (!parts.length && fullText) {
    parts.push({ who: 'Conversa', text: fullText });
  }
  if (!parts.length) { toast('Nada para exportar'); return; }

  toast('A gerar PDF…');
  let JsPDF;
  try {
    JsPDF = await loadJsPdfLib();
  } catch (e) {
    toast(e.message || 'Não foi possível carregar a biblioteca PDF');
    return;
  }

  try {
    const doc = new JsPDF({ unit: 'mm', format: 'a4' });
    const margin = 14;
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const maxW = pageW - margin * 2;
    let y = margin;

    function ensureSpace(h){
      if (y + h > pageH - margin) {
        doc.addPage();
        y = margin;
      }
    }
    function writeText(str, fontSize, style, color){
      doc.setFont('helvetica', style || 'normal');
      doc.setFontSize(fontSize || 11);
      if (color) doc.setTextColor(color[0], color[1], color[2]);
      else doc.setTextColor(20, 20, 20);
      const lines = doc.splitTextToSize(String(str || ''), maxW);
      const lineH = (fontSize || 11) * 0.42;
      lines.forEach(line => {
        ensureSpace(lineH + 1);
        doc.text(line, margin, y);
        y += lineH;
      });
    }

    writeText('Limanet — Assistente Gemini', 16, 'bold', [27, 67, 50]);
    y += 2;
    writeText('Apoio educacional · ' + when, 10, 'normal', [80, 80, 80]);
    y += 2;
    writeText('Profissional: ' + prof + (crn ? '  ·  ' + crn : ''), 10, 'normal', [40, 40, 40]);
    if (pacTxt) writeText('Paciente: ' + pacTxt, 10, 'normal', [40, 40, 40]);
    y += 3;
    doc.setDrawColor(180);
    doc.line(margin, y, pageW - margin, y);
    y += 6;

    parts.forEach((p, idx) => {
      ensureSpace(12);
      writeText(p.who, 11, 'bold', [27, 67, 50]);
      y += 1;
      writeText(p.text, 11, 'normal', [20, 20, 20]);
      y += 4;
      if (idx < parts.length - 1) {
        ensureSpace(4);
        doc.setDrawColor(220);
        doc.line(margin, y, pageW - margin, y);
        y += 5;
      }
    });

    y += 4;
    ensureSpace(16);
    doc.setDrawColor(180);
    doc.line(margin, y, pageW - margin, y);
    y += 5;
    writeText('Documento de apoio gerado no Limanet. Não substitui avaliação clínica presencial, prescrição nem conduta formal.', 9, 'normal', [90, 90, 90]);

    const safeName = (pacTxt || 'gemini').replace(/[^\wÀ-ú]+/gi, '_').slice(0, 40);
    const fname = 'Limanet_Gemini_' + safeName + '_' + Date.now() + '.pdf';
    doc.save(fname);
    toast('PDF descarregado: ' + fname);
  } catch (err) {
    console.error(err);
    toast('Erro ao gerar PDF: ' + (err.message || err));
  }
}
async function enviarGemini(){
  const key = (localStorage.getItem('limanet_gemini_key') || '').trim();
  const prompt = (document.getElementById('gemPrompt').value || '').trim();
  const log = document.getElementById('gemLog');
  if (!key) { toast('Configure a chave Gemini em Configurações'); showView('config'); return; }
  if (!prompt) { toast('Escreva uma pergunta'); return; }

  const pacId = +(document.getElementById('gemPac').value || 0);
  const pac = DB.pacientes.find(p => p.id === pacId);
  const mode = (document.getElementById('gemMode') || {}).value || 'geral';
  const modeHint = {
    geral: 'Responda como apoio a nutricionista brasileiro (CFN). Seja objetivo e cite quando for referência geral.',
    plano: 'Sugira estrutura de plano alimentar educacional (refeições, grupos), sem cardápio rígido prescritivo.',
    exame: 'Comente exames em tom educacional; não diagnostique; indique quando reavaliar com médico.',
    fito: 'Fale de fitoterápicos com cautela: monografia, interações, gravidez; não incentive automedicação.'
  }[mode] || '';

  let ctx = modeHint + '\nResponda em português do Brasil. Use os dados clínicos abaixo se existirem; não invente valores em falta.';
  if (pac) {
    const idade = ageFrom(pac.nasc);
    ctx += `\n--- Dados do paciente ---\nnome: ${pac.nome}; sexo: ${pac.sexo}; idade: ${idade}; peso: ${pac.peso||'?'} kg; altura: ${pac.altura||'?'} m.`;
    // Plano alimentar salvo
    const pl = (DB.planos && DB.planos[pac.id]) || null;
    if (pl && pl.refeicoes) {
      const nomes = {cafe:'Café',lanche1:'Lanche 1',almoco:'Almoço',lanche2:'Lanche 2',jantar:'Jantar',ceia:'Ceia'};
      const linhas = [];
      Object.keys(pl.refeicoes).forEach(k => {
        const itens = pl.refeicoes[k] || [];
        if (itens.length) {
          const txt = itens.map(it => {
            if (typeof it === 'string') return it;
            return [it.alimento||it.nome, it.qtd||it.porcao, it.medida].filter(Boolean).join(' ');
          }).join('; ');
          linhas.push((nomes[k]||k) + ': ' + txt);
        }
      });
      if (linhas.length) ctx += '\n--- Plano alimentar registado ---\n' + linhas.join('\n');
      else ctx += '\n(Plano alimentar ainda sem itens registados.)';
    } else {
      ctx += '\n(Sem plano alimentar guardado para este paciente.)';
    }
    // Exames laboratoriais
    const ex = (DB.exames && (DB.exames[pac.id] || DB.exames[String(pac.id)])) || null;
    if (ex && ex.valores && Object.keys(ex.valores).length) {
      const pares = Object.entries(ex.valores)
        .filter(([,v]) => v !== '' && v != null)
        .map(([k,v]) => k + ': ' + v)
        .slice(0, 40);
      ctx += '\n--- Exames laboratoriais' + (ex.data ? ' (data ' + ex.data + ')' : '') + ' ---\n' + pares.join('; ');
      if (ex.bio) ctx += '\nBioimpedância / notas bio: ' + (typeof ex.bio === 'string' ? ex.bio : JSON.stringify(ex.bio));
      if (ex.obs) ctx += '\nObs. exames: ' + ex.obs;
    } else {
      ctx += '\n(Sem exames laboratoriais guardados para este paciente.)';
    }
    ctx += '\n--- Fim dos dados ---';
  }

  log.insertAdjacentHTML('beforeend', `<div class="gemini-msg user"><div class="who">Você</div>${esc(prompt)}</div>`);
  document.getElementById('gemPrompt').value = '';
  const pending = document.createElement('div');
  pending.className = 'gemini-msg bot';
  pending.innerHTML = '<div class="who">Gemini</div>A processar…';
  log.appendChild(pending);
  log.scrollTop = log.scrollHeight;

  const model = 'gemini-2.5-flash';
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(key)}`;
  try {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: ctx + '\n\nPergunta do profissional:\n' + prompt }] }],
        generationConfig: { temperature: 0.6 }
      })
    });
    const data = await r.json();
    if (!r.ok) {
      pending.className = 'gemini-msg error';
      pending.innerHTML = `<div class="who">Erro</div>${esc(data.error?.message || r.statusText || 'Falha na API')}`;
      return;
    }
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
    if (text) {
      pending.className = 'gemini-msg bot';
      pending.innerHTML = `<div class="who">Gemini</div>${esc(text)}`;
    } else if (data.promptFeedback?.blockReason) {
      pending.className = 'gemini-msg error';
      pending.innerHTML = `<div class="who">Bloqueado</div>${esc(data.promptFeedback.blockReason)}`;
    } else {
      pending.className = 'gemini-msg error';
      pending.innerHTML = '<div class="who">Erro</div>Resposta vazia ou inesperada.';
    }
  } catch (e) {
    pending.className = 'gemini-msg error';
    pending.innerHTML = `<div class="who">Erro</div>${esc(e.message || 'Rede')}`;
  }
  log.scrollTop = log.scrollHeight;
}
