<html lang="pt-BR"><head>

<style>
:root{
  --bg:#e8f0ea; --panel:#fff; --line:#c5d5c8; --text:#1a2a35; --muted:#5a6f7d;
  --primary:#2d6a4f; --primary2:#1b4332; --accent:#40916c; --danger:#c0392b;
  --menu:#1b4332; --menuHover:#2d6a4f; --header:#1b4332;
  --ok:#1e7e4a; --warn:#b8860b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:13px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* LOGIN */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#1b4332,#2d6a4f 50%,#52b788)}
.loginBox{background:#fff;border-radius:10px;padding:32px 36px;width:min(400px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.loginLogo{display:block;width:104px;height:104px;object-fit:contain;margin:0 auto 14px;border-radius:12px}
.loginBox h1{margin:0 0 4px;font-size:1.6rem;color:var(--primary2);text-align:center}
.loginBox .sub{text-align:center}
.loginPassWrap{position:relative;display:flex;align-items:center}
.loginPassWrap input{padding-right:76px}
.loginPassToggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:#edf5ef;color:var(--primary2);border-radius:4px;padding:5px 8px;font-size:11px;font-weight:700}
.loginPassToggle:focus{outline:2px solid var(--accent);outline-offset:1px}
.topbar .brand-wrap{display:flex;align-items:center;gap:8px;min-width:0}
.topbar .brand-logo{width:30px;height:30px;object-fit:contain;border-radius:5px;background:#fff;padding:2px}

.loginBox .sub{color:var(--muted);margin-bottom:22px}
.contactFooter{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.6}
.contactFooter a{color:var(--primary);font-weight:600;text-decoration:none}
.contactFooter a:hover{text-decoration:underline}
.teia-wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.teia-svg{background:#f0f7f2;border:1px solid var(--line);border-radius:10px;width:100%;max-width:360px;height:auto;display:block}
.teia-wrap{max-width:100%;overflow:hidden}
.teia-node{cursor:pointer}
.teia-node circle{fill:#d8f3dc;stroke:#2d6a4f;stroke-width:2;transition:.2s}
.teia-node text{font-size:11px;fill:#1b4332;pointer-events:none;font-weight:600}
.teia-node.on circle{fill:#2d6a4f;stroke:#1b4332}
.teia-node.on text{fill:#fff}
.teia-node.warn circle{fill:#fff3cd;stroke:#b8860b}
.sintoma-item{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-bottom:1px solid #eef2f0;font-size:12px}
.sintoma-item:hover{background:#f3faf5}
.sintoma-item input{margin-top:2px}
.chip{display:inline-block;background:#d8f3dc;color:#1b4332;border-radius:12px;padding:2px 8px;margin:2px;font-size:11px;font-weight:700}
.chip-warn{background:#fff3cd;color:#7a5b00}
.chip-bad{background:#f8d7da;color:#721c24}
.rx-preview{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px;max-width:800px}
.rx-preview .rx-head{display:flex;justify-content:space-between;border-bottom:3px solid var(--primary2);padding-bottom:10px;margin-bottom:14px}
.rx-preview .brand{font-weight:800;font-size:17px;color:var(--primary2)}
.rx-preview .rx-title{text-align:center;font-weight:800;color:var(--primary2);margin:12px 0;letter-spacing:.04em}
.rx-preview .rx-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px;margin-bottom:12px}
.rx-preview .rx-section{margin:12px 0}
.rx-preview .rx-section h3{font-size:12px;text-transform:uppercase;color:var(--primary2);border-bottom:1px solid var(--line);padding-bottom:4px;margin:0 0 6px}
.rx-preview .rx-text{white-space:pre-wrap;font-size:13px;min-height:40px}
.rx-preview .sig-block{margin-top:28px;text-align:center;page-break-inside:avoid}
.rx-preview .sig-wrap{position:relative;width:260px;height:100px;margin:0 auto}
.rx-preview .sig-block .stamp-img{
  position:absolute;left:50%;bottom:6px;transform:translateX(-50%);
  width:190px;max-width:95%;height:auto;max-height:95px;object-fit:contain;
  z-index:2;mix-blend-mode:multiply;pointer-events:none
}
.rx-preview .sig-block .sig-line{
  position:absolute;left:0;right:0;bottom:0;
  border-top:1px solid #222;height:0;z-index:1
}
.rx-preview .sig-label{margin-top:6px;font-size:11px;color:#444}
.rx-preview .disclaimer{margin-top:16px;border-left:4px solid #d3a52e;background:#fff9e8;padding:8px;font-size:10px;color:#594b28}
.rx-preview .legal-foot{margin-top:18px;font-size:9.5px;line-height:1.35;color:#444;text-align:justify;border-top:1px solid #ccc;padding-top:10px}
@page{size:A4 portrait;margin:12mm}
@media print{
  html,body{width:210mm;height:297mm;margin:0!important;padding:0!important;background:#fff!important}
  body *{visibility:hidden!important}
  #printArea, #printArea *{visibility:visible!important}
  #printArea{
    position:absolute;left:0;top:0;width:186mm;max-width:186mm;
    padding:0;margin:0;box-sizing:border-box;
    background:#fff!important;border:0!important;box-shadow:none!important;border-radius:0!important
  }
  .no-print,.menubar,.topbar,.sidebar,.statusBar,#loginScreen,.toast{display:none!important}
  .rx-preview .stamp-img{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .panel{box-shadow:none!important;border:0!important;background:#fff!important}
  /* fallback: imprimir conteúdo da consulta quando não há #printArea */
  body.print-content #content,
  body.print-content #content *{visibility:visible!important}
  body.print-content #content{
    position:absolute;left:0;top:0;width:186mm;padding:0;margin:0
  }
  body.print-content .no-print{display:none!important}
}
.loginBox label{display:block;font-weight:600;margin:12px 0 5px}
.loginBox input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px}
.loginBox .btn{margin-top:18px;width:100%;padding:11px;background:var(--primary);color:#fff;border:0;border-radius:6px;font-weight:700}
.loginBox .btn:hover{background:var(--primary2)}
.loginHint{margin-top:14px;font-size:12px;color:var(--muted);text-align:center}

/* APP SHELL */
#app{display:none;height:100vh;flex-direction:column}
#app.on{display:flex}
.topbar{background:linear-gradient(90deg,#1b4332 0%,#2d6a4f 45%,#52b788 100%);color:#fff;display:flex;align-items:center;gap:16px;padding:0 12px;height:46px;flex-shrink:0}
.topbar .brand{font-weight:800;letter-spacing:.03em;font-size:16px}
.topbar .user{margin-left:auto;font-size:12px;opacity:.9}
.topbar button{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;padding:4px 10px;border-radius:4px}
.topbar button:hover{background:rgba(255,255,255,.12)}

/* MENU */
.menubar{background:var(--menu);color:#dce8f0;display:flex;flex-wrap:wrap;gap:2px;padding:0 6px;flex-shrink:0;border-bottom:1px solid #0a2030}
.menubar .m{position:relative}
.menubar .m>button{background:transparent;border:0;color:#dce8f0;padding:8px 12px;font-weight:600}
.menubar .m>button:hover,.menubar .m.open>button{background:var(--menuHover)}
.menubar .drop{display:none;position:absolute;top:100%;left:0;background:#fff;color:var(--text);min-width:220px;border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:50}
.menubar .m.open .drop{display:block}
.menubar .drop button{display:block;width:100%;text-align:left;padding:8px 14px;border:0;background:#fff;border-bottom:1px solid #eef2f5}
.menubar .drop button:hover{background:#e8f4fa}
.menubar .drop .sep{height:1px;background:var(--line);margin:4px 0}

/* BODY */
.main{flex:1;display:flex;overflow:hidden}
.sidebar{width:200px;background:#f4f7fa;border-right:1px solid var(--line);padding:10px;overflow:auto;flex-shrink:0}
.sidebar h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
.sidebar button{display:block;width:100%;text-align:left;padding:8px 10px;margin-bottom:3px;border:1px solid transparent;background:transparent;border-radius:5px}
.sidebar button:hover,.sidebar button.active{background:#d6ebf5;border-color:#a8c8d8}
.content{flex:1;overflow:auto;padding:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.panel h2{margin:0 0 12px;font-size:1.15rem;color:var(--primary2);border-bottom:2px solid #d0e4ef;padding-bottom:8px}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:10px}
.field{flex:1;min-width:140px}
.field label{display:block;font-weight:600;margin-bottom:4px;color:var(--muted);font-size:12px}
.field input,.field select,.field textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:5px}
.field textarea{min-height:70px;resize:vertical}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{padding:7px 14px;border:1px solid var(--line);border-radius:5px;background:#f5f8fa;font-weight:600}
.btn:hover{background:#e4eef5}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary2)}
.btn-ok{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left}
th{background:#eef5f9;font-weight:700}
tr:nth-child(even){background:#fafcfd}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:#e3f2fa}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.badge-ok{background:#d4edda;color:var(--ok)}
.badge-warn{background:#fff3cd;color:var(--warn)}
.badge-bad{background:#f8d7da;color:var(--danger)}
.stat{display:inline-block;background:#eef6fb;border:1px solid #c5dde8;border-radius:6px;padding:8px 14px;margin:4px 6px 4px 0}
.stat b{display:block;font-size:1.2rem;color:var(--primary2)}
.toast{position:fixed;bottom:20px;right:20px;background:#1a2a35;color:#fff;padding:12px 18px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:100;opacity:0;transition:.3s}
.toast.show{opacity:1}
.statusBar{background:#dfe8ef;border-top:1px solid var(--line);padding:4px 12px;font-size:11px;color:var(--muted);flex-shrink:0}
@media(max-width:800px){
  .sidebar{display:none}
  .menubar{font-size:12px}
}
</style>

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
}
function status(msg){ document.getElementById('statusBar').textContent = msg; }
function ageFrom(nasc){
  if(!nasc) return '—';
  const d=new Date(nasc+'T00:00:00'); const n=new Date();
  let a=n.getFullYear()-d.getFullYear();
  const m=n.getMonth()-d.getMonth();
  if(m<0||(m===0&&n.getDate()<d.getDate())) a--;
  return a;
}
function imc(peso, altura){
  if(!peso||!altura||altura<=0) return null;
  return peso/(altura*altura);
}
function classIMC(v){
  if(v==null) return {t:'—', c:''};
  if(v<18.5) return {t:'Baixo peso', c:'badge-warn'};
  if(v<25) return {t:'Eutrófico', c:'badge-ok'};
  if(v<30) return {t:'Sobrepeso', c:'badge-warn'};
  return {t:'Obesidade', c:'badge-bad'};
}
function pesoIdeal(sexo, altura){
  // fórmula simplificada (Devine)
  if(!altura) return null;
  const pol = altura * 39.3701;
  if(sexo==='M') return 50 + 2.3*(pol-60);
  return 45.5 + 2.3*(pol-60);
}
function tmbMifflin(sexo, peso, alturaCm, idade){
  if(sexo==='M') return 10*peso + 6.25*alturaCm - 5*idade + 5;
  return 10*peso + 6.25*alturaCm - 5*idade - 161;
}
/** Harris-Benedict original (1919) */
function tmbHarris1919(sexo, peso, alturaCm, idade){
  if(sexo==='M') return 66.473 + 13.7516*peso + 5.0033*alturaCm - 6.755*idade;
  return 655.0955 + 9.5634*peso + 1.8496*alturaCm - 4.6756*idade;
}
/** Harris-Benedict revisada (Roza & Shizgal 1984) — a mais usada clinicamente como "HB atualizada" */
function tmbHarris1984(sexo, peso, alturaCm, idade){
  if(sexo==='M') return 88.362 + 13.397*peso + 4.799*alturaCm - 5.677*idade;
  return 447.593 + 9.247*peso + 3.098*alturaCm - 4.330*idade;
}
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

/* URL da API no Render — altere após o deploy */
const LIMANET_API = (window.LIMANET_API_URL || 'https://limanet-api.onrender.com').replace(/\/$/, '');

function alternarVisibilidadeSenha(){
  const campo = document.getElementById('loginPass');
  const botao = document.getElementById('toggleLoginPass');
  if (!campo || !botao) return;
  const mostrar = campo.type === 'password';
  campo.type = mostrar ? 'text' : 'password';
  botao.textContent = mostrar ? 'Ocultar' : 'Mostrar';
  botao.setAttribute('aria-pressed', String(mostrar));
  campo.focus();
}

async function doLogin(){
  const user = (document.getElementById('loginUser').value || '').trim();
  const pass = (document.getElementById('loginPass').value || '').trim();
  if (!user || !pass) { toast('Informe utilizador e senha'); return; }

  const btn = document.querySelector('#loginScreen .btn');
  if (btn) { btn.disabled = true; btn.textContent = 'A entrar…'; }

  try {
    const r = await fetch(LIMANET_API + '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user, pass })
    });
    let data = {};
    try { data = await r.json(); } catch (_) {}
    if (!r.ok || !data.ok) {
      toast((data && data.msg) || 'Utilizador ou senha inválidos');
      return;
    }
    sessionStorage.setItem('limanet_token', data.token);
    sessionStorage.setItem('limanet_nome', data.nome || '');
    sessionStorage.setItem('limanet_crn', data.crn || '');
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('app').classList.add('on');
    document.getElementById('lblUser').textContent = (data.nome || DB.user.nome) + ' · ' + (data.crn || DB.user.crn || '');
    showView('inicio');
    toast('Login realizado com sucesso!');
  } catch (e) {
    toast('Sem ligação ao servidor de login (Render). Verifique a URL LIMANET_API.');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Entrar'; }
  }
}
function doLogout(){
  sessionStorage.removeItem('limanet_token');
  sessionStorage.removeItem('limanet_nome');
  sessionStorage.removeItem('limanet_crn');
  document.getElementById('app').classList.remove('on');
  document.getElementById('loginScreen').classList.remove('hidden');
}

function imprimirA4() {
  const area = document.getElementById('printArea');
  const conteudo = area || document.getElementById('content');

  if (!conteudo) {
    toast('Não foi encontrado conteúdo para imprimir.');
    return;
  }

  // Abre a janela imediatamente, durante o clique do usuário.
  const janela = window.open('', '_blank');

  if (!janela) {
    toast('A janela de impressão foi bloqueada. Permita pop-ups para este site.');
    return;
  }

  // Copia os estilos existentes do Limanet.
  const estilos = Array.from(
    document.head.querySelectorAll('style, link[rel="stylesheet"]')
  ).map(el => el.outerHTML).join('\n');

  // Copia apenas o conteúdo que deve ser impresso.
  const copia = conteudo.cloneNode(true);
  copia.id = 'printArea';

  // Retira botões e elementos interativos da impressão.
  copia.querySelectorAll(
    'button, .no-print, input[type="button"], input[type="submit"]'
  ).forEach(el => el.remove());

  janela.document.open();
  janela.document.write(`
    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Imprimir — Limanet</title>
      ${estilos}
      <style>
        @page { size: A4 portrait; margin: 12mm; }
        html, body {
          background: #fff !important;
          color: #111 !important;
          margin: 0;
          padding: 0;
          height: auto !important;
          font-family: Arial, sans-serif;
        }
        #printArea {
          display: block !important;
          position: static !important;
          width: 100% !important;
          max-width: 100% !important;
          height: auto !important;
          margin: 0 !important;
          padding: 0 !important;
          visibility: visible !important;
          background: #fff !important;
          color: #111 !important;
          box-shadow: none !important;
          border: 0 !important;
        }
        #printArea, #printArea * {
          visibility: visible !important;
        }
        @media print {
          body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
          button, .no-print { display: none !important; }
        }
      </style>
    </head>
    <body>${copia.outerHTML}</body>
    </html>
  `);
  janela.document.close();

  // Aguarda o carregamento do conteúdo antes de imprimir.
  janela.addEventListener('load', function () {
    janela.focus();
    janela.print();
  }, { once: true });
}

  const pac=DB.pacientes.find(p=>p.id===(selectedPacienteId||DB.pacientes[0]?.id));
  c.innerHTML=`

        </select>
      </div>
      <div class="field" style="max-width:140px"><label>% Gordura (Katch-McArdle)</label><input id="enPctG" type="number" step="0.1" min="0" max="70" placeholder="ex: 22"></div>
    </div>
    <div class="btns">
      <button type="button" class="btn btn-primary" onclick="calcEnergia()">Calcular TMB e GET</button>
    </div>
    <div id="enResult" style="margin-top:14px"></div>
  </div>`;

function calcEnergia(){
  const pac=DB.pacientes.find(p=>p.id==+$('#enPac').value);
  const peso=parseFloat($('#enPeso').value);
  const alt=parseFloat($('#enAlt').value);
  const fat=parseFloat($('#enFat').value);
  const pctG=parseFloat(($('#enPctG')||{}).value);
  if(!pac||!peso||!alt){ toast('Informe peso e altura!'); return; }
  const idade=ageFrom(pac.nasc); if(typeof idade!=='number'){ toast('Informe nascimento do paciente'); return; }
  const h=alt*100;
  const tmbM=tmbMifflin(pac.sexo, peso, h, idade);
  const tmbHB84=tmbHarris1984(pac.sexo, peso, h, idade);
  let tmbKM=null, getKM=null, lbm=null;
  if(!isNaN(pctG) && pctG>=0 && pctG<70){
    lbm=peso*(1-pctG/100);
    tmbKM=370+21.6*lbm; // Katch-McArdle
    getKM=tmbKM*fat;
  }
  const getM=tmbM*fat, getHB84=tmbHB84*fat;
  const protMin=peso*0.8, protMax=peso*1.2;
  const agua=peso*35;
  const sexoLbl=pac.sexo==='M'?'Masculino':'Feminino';
  $('#enResult').innerHTML=`
    <p style="margin:0 0 8px"><b>Sexo:</b> ${sexoLbl} · <b>Idade:</b> ${idade} a · <b>Fator:</b> ${fat}</p>
    <table style="margin-bottom:12px">
      <thead><tr><th>Fórmula</th><th>TMB (kcal)</th><th>GET (kcal)</th></tr></thead>
      <tbody>
        <tr><td>Mifflin-St Jeor (1990)</td><td><b>${Math.round(tmbM)}</b></td><td><b>${Math.round(getM)}</b></td></tr>
        <tr><td>Harris-Benedict revisada (Roza 1984)</td><td><b>${Math.round(tmbHB84)}</b></td><td><b>${Math.round(getHB84)}</b></td></tr>
        <tr><td>Katch-McArdle ${tmbKM?`(MLG ${lbm.toFixed(1)} kg)`:'(% gordura não informado)'}</td>
          <td>${tmbKM?`<b>${Math.round(tmbKM)}</b>`:'—'}</td>
          <td>${getKM?`<b>${Math.round(getKM)}</b>`:'—'}</td></tr>
      </tbody>
    </table>
    <span class="stat"><b>${protMin.toFixed(0)}–${protMax.toFixed(0)} g</b>Proteína/dia (est.)</span>
    <span class="stat"><b>${Math.round(agua)} ml</b>Água/dia (est. 35 ml/kg)</span>
    <p style="margin-top:10px;color:var(--muted)">
      <b>HB 1984 ♂:</b> 88,362 + 13,397×P + 4,799×A − 5,677×I &nbsp;·&nbsp;
      <b>♀:</b> 447,593 + 9,247×P + 3,098×A − 4,330×I<br>
      <b>Katch-McArdle:</b> 370 + 21,6 × massa magra (kg). Informe o % de gordura (bioimpedância) para calcular.
    </p>`;
}

function addAoPlano(){
  const plPac=document.getElementById('plPac');
  const plRef=document.getElementById('plRef');
  const plAlim=document.getElementById('plAlim');
  const plQtd=document.getElementById('plQtd');
  if(!plPac||!plRef||!plAlim){ toast('Campos do plano não encontrados'); return; }
  const id=String(plPac.value||'');
  if(!id){ toast('Selecione o paciente'); return; }
  const alimId=parseInt(plAlim.value,10);
  if(!alimId){ toast('Selecione um alimento da tabela'); return; }
  const qtd=parseFloat(plQtd&&plQtd.value)||1;
  const ref=plRef.value||'cafe';
  if(!DB.planos) DB.planos={};
  const plano=DB.planos[id]||window._planoTmp||{refeicoes:{cafe:[],lanche1:[],almoco:[],lanche2:[],jantar:[],ceia:[]}};
  if(!plano.refeicoes) plano.refeicoes={cafe:[],lanche1:[],almoco:[],lanche2:[],jantar:[],ceia:[]};
  if(!plano.refeicoes[ref]) plano.refeicoes[ref]=[];
  plano.refeicoes[ref].push({alimId,qtd});
  DB.planos[id]=plano;
  window._planoTmp=plano;
  selectedPacienteId=+id;
  saveDB();
  showView('plano');
  toast('Alimento adicionado ao cardápio');
}
function removerDoPlano(ref,i){
  const plPac=document.getElementById('plPac');
  const id=String(plPac?plPac.value:(selectedPacienteId||''));
  if(!id||!DB.planos[id]){ toast('Plano não encontrado'); return; }
  const plano=DB.planos[id];
  if(!plano.refeicoes[ref]) return;
  plano.refeicoes[ref].splice(i,1);
  DB.planos[id]=plano;
  window._planoTmp=plano;
  saveDB();
  showView('plano');
  toast('Item removido');
}
function salvarPlano(){
  const plPac=document.getElementById('plPac');
  const id=String(plPac?plPac.value:'');
  if(!id){ toast('Selecione o paciente'); return; }
  if(window._planoTmp) DB.planos[id]=window._planoTmp;
  saveDB(); toast('Plano alimentar salvo!');
}

function exportBackup(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='limanet-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  toast('Backup realizado com sucesso!');
}
function importBackup(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      DB=JSON.parse(r.result); saveDB();
      toast('Restauração do backup realizada com sucesso!');
      showView('inicio');
    }catch(e){ toast('Arquivo de backup inválido'); }
  };
  r.readAsText(f);
}

function calcGestante(){
  const pesoPre=parseFloat($('#gPesoPre').value);
  const pesoAt=parseFloat($('#gPesoAt').value);
  const alt=parseFloat($('#gAlt').value);
  const ig=parseFloat($('#gIG').value)||0;
  const trim=+$('#gTrim').value;
  const au=parseFloat($('#gAU').value);
  if(!pesoPre||!alt){ toast('Informe peso pré-gestacional e altura!'); return; }
  const imcPre=pesoPre/(alt*alt);
  let faixa='Eutrófico', ganhoMin=11.5, ganhoMax=16, semMin=0.35, semMax=0.50;
  if(imcPre<18.5){ faixa='Baixo peso'; ganhoMin=12.5; ganhoMax=18; semMin=0.44; semMax=0.58; }
  else if(imcPre<25){ faixa='Eutrófico'; ganhoMin=11.5; ganhoMax=16; semMin=0.35; semMax=0.50; }
  else if(imcPre<30){ faixa='Sobrepeso'; ganhoMin=7; ganhoMax=11.5; semMin=0.23; semMax=0.33; }
  else { faixa='Obesidade'; ganhoMin=5; ganhoMax=9; semMin=0.17; semMax=0.27; }
  const ganhoAtual=(pesoAt&&pesoPre)?(pesoAt-pesoPre):null;
  const extra={1:0,2:340,3:452}[trim]||0;
  // TMB pré como base (aprox. mulher)
  const idade=ageFrom(DB.pacientes.find(p=>p.id==+$('#gPac').value)?.nasc);
  let tmbBase=null, getGest=null;
  if(typeof idade==='number' && pesoPre && alt){
    tmbBase=tmbMifflin('F', pesoPre, alt*100, idade);
    getGest=tmbBase*1.375+extra; // atividade leve + adicional gestacional
  }
  // Altura uterina esperada ~ IG em cm após 20 sem (regra prática)
  let auMsg='';
  if(au && ig>=20){
    const esp=ig;
    const dif=au-esp;
    if(Math.abs(dif)<=2) auMsg='Altura uterina compatível com a IG (±2 cm).';
    else if(dif>2) auMsg='Altura uterina acima do esperado para a IG — avaliar clinicamente.';
    else auMsg='Altura uterina abaixo do esperado para a IG — avaliar clinicamente.';
  }
  $('#gResult').innerHTML=`
    <span class="stat"><b>${imcPre.toFixed(1)}</b>IMC pré-gestacional · ${faixa}</span>
    <span class="stat"><b>${ganhoMin} – ${ganhoMax} kg</b>Ganho total IOM</span>
    <span class="stat"><b>${semMin} – ${semMax} kg</b>/semana (2º–3º tri)</span>
    ${ganhoAtual!=null?`<span class="stat"><b>${ganhoAtual>=0?'+':''}${ganhoAtual.toFixed(1)} kg</b>Ganho até agora (IG ${ig} sem)</span>`:''}
    <span class="stat"><b>+${extra} kcal</b>Adicional energético (${trim}º tri)</span>
    ${getGest?`<span class="stat"><b>${Math.round(getGest)} kcal</b>GET gestacional (est.)</span>`:''}
    ${auMsg?`<p style="margin-top:10px">${auMsg}</p>`:''}
    <p style="margin-top:8px;color:var(--muted)">Valores de referência IOM. Conduta final é clínica e individualizada (gemelaridade, patologias, adolescente).</p>`;
}

function importarTextoExames(){
  const txt=($('#exImport').value||'').toLowerCase().normalize('NFD').replace(/\p{M}/gu,'');
  if(!txt.trim()){ toast('Cole o texto do laudo primeiro'); return; }
  const mapa=[
    [/hemoglobin[ae]?[^\d]{0,20}(\d+[.,]\d+|\d+)/i,'hb'],
    [/hematocrit[oe]?[^\d]{0,20}(\d+[.,]\d+|\d+)/i,'ht'],
    [/\bvcm\b[^\d]{0,20}(\d+[.,]\d+|\d+)/i,'vcm'],
    [/\brdw\b[^\d]{0,20}(\d+[.,]\d+|\d+)/i,'rdw'],
    [/leucocit[^\d]{0,20}(\d+[.,]?\d*)/i,'leu'],
    [/ferritin[ae]?[^\d]{0,20}(\d+[.,]\d+|\d+)/i,'ferritina'],
    [/ferro seric[oa]?[^\d]{0,20}(\d+[.,]\d+|\d+)/i,'ferro'],
    [/vitamina d|25.?oh|25oh[^\d]{0,20}(\d+[.,]\d+|\d+)/i,'vitd'],
    [/vitamina b12|cobalamina[^\d]{0,20}(\d+[.,]\d+|\d+)/i,'b12'],
    [/acido folico|folato[^\d]{0,20}(\d+[.,]\d+|\d+)/i,'folato'],
    [/glicose[^\d]{0,30}(\d+[.,]\d+|\d+)/i,'glicose'],
    [/hba1c|hemoglobina glic[^\d]{0,20}(\d+[.,]\d+|\d+)/i,'hba1c'],
    [/colesterol total[^\d]{0,20}(\d+[.,]\d+|\d+)/i,'ct'],
    [/\bldl\b[^\d]{0,20}(\d+[.,]\d+|\d+)/i,'ldl'],
    [/\bhdl\b[^\d]{0,20}(\d+[.,]\d+|\d+)/i,'hdl'],
    [/triglicer[^\d]{0,20}(\d+[.,]\d+|\d+)/i,'tg'],
    [/\btsh\b[^\d]{0,20}(\d+[.,]\d+|\d+)/i,'tsh'],
    [/albumin[ae]?[^\d]{0,20}(\d+[.,]\d+|\d+)/i,'albumina'],
    [/\bpcr\b|proteina c reativa[^\d]{0,20}(\d+[.,]\d+|\d+)/i,'pcr'],
    [/creatinin[ae]?[^\d]{0,20}(\d+[.,]\d+|\d+)/i,'creatinina'],
    [/%?\s*gordura|fat\s*%[^\d]{0,15}(\d+[.,]\d+|\d+)/i,'bioGord'],
    [/massa magra|fat.?free[^\d]{0,15}(\d+[.,]\d+|\d+)/i,'bioMM'],
    [/agua corporal|body water[^\d]{0,15}(\d+[.,]\d+|\d+)/i,'bioAgua'],
    [/angulo de fase|phase angle[^\d]{0,15}(\d+[.,]\d+|\d+)/i,'bioAF']
  ];
  let n=0;
  mapa.forEach(([re,id])=>{
    const m=txt.match(re);
    if(!m) return;
    const val=m[1].replace(',','.');
    const el=document.getElementById(id.startsWith('bio')?id:'ex_'+id);
    if(el){ el.value=val; n++; }
  });
  toast(n?`Importados ${n} valores do texto`:'Nenhum valor reconhecido — preencha manualmente');
}
function salvarExames(){
  const id=$('#exPac').value;
  if(!id){ toast('Informe o paciente!'); return; }
  const valores={};
  EXAMES_PADRAO.forEach(e=>{
    const v=document.getElementById('ex_'+e.id).value.trim();
    if(v!=='') valores[e.id]=v;
  });
  const bio={
    gordura:$('#bioGord').value, massaMagra:$('#bioMM').value,
    agua:$('#bioAgua').value, tmb:$('#bioTmb').value, angulo:$('#bioAF').value
  };
  if(!DB.exames) DB.exames={};
  DB.exames[id]={ data:$('#exData').value, valores, bio, obs:$('#exObs').value };
  saveDB(); toast('Exames e bioimpedância salvos!');
}

function viewTeia(c){
  if(!DB.teia) DB.teia={};
  const pac=DB.pacientes.find(p=>p.id===(selectedPacienteId||DB.pacientes[0]?.id));
  const key=pac?String(pac.id):'';
  const dados=DB.teia[key]||{sintomas:[], eixos:[]};
  const marcados=new Set(dados.sintomas||[]);
  const eixosOn=new Set(dados.eixos||[]);

  // contar nutrientes sugeridos
  const nutriCount={};
  SINTOMAS_MICRO.forEach((s,i)=>{
    if(!marcados.has(i)) return;
    s.n.split(/[,/]+/).map(x=>x.trim()).filter(Boolean).forEach(n=>{
      nutriCount[n]=(nutriCount[n]||0)+1;
    });
    (s.eixos||[]).forEach(e=>eixosOn.add(e));
  });
  const topNutri=Object.entries(nutriCount).sort((a,b)=>b[1]-a[1]).slice(0,12);

  // ligações com exames / alergias / plano
  const exames=DB.exames&&DB.exames[key];
  const alerg=DB.alergias&&DB.alergias[key];
  const plano=DB.planos&&DB.planos[key];

  const nodes=EIXOS_TEIA.map(e=>{
    const on=eixosOn.has(e.id);
    const lines=e.label.split('\n');
    return `<g class="teia-node ${on?'on':''}" data-eixo="${e.id}" onclick="toggleEixoTeia('${e.id}')">
      <circle cx="${e.x}" cy="${e.y}" r="36"/>
      <text x="${e.x}" y="${e.y+(lines.length>1?-4:4)}" text-anchor="middle">${lines[0]}</text>
      ${lines[1]?`<text x="${e.x}" y="${e.y+12}" text-anchor="middle">${lines[1]}</text>`:''}
    </g>`;
  }).join('');
  const lines=EIXOS_LINKS.map(([a,b])=>{
    const A=EIXOS_TEIA[a], B=EIXOS_TEIA[b];
    return `<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="#95d5b2" stroke-width="2"/>`;
  }).join('');

  c.innerHTML=`
  <div class="panel">
    <h2>Teia de inter-relações metabólicas · Sinais e sintomas</h2>
    <div class="row">
      <div class="field"><label>Paciente</label>
        <select id="teiaPac" onchange="selectedPacienteId=+this.value;showView('teia')">${pacOptions(pac&&pac.id)}</select>
      </div>
    </div>
    <div class="teia-wrap">
      <div>
        <svg class="teia-svg" viewBox="0 0 420 480" width="100%" preserveAspectRatio="xMidYMid meet" style="max-width:300px;max-height:340px">
          ${lines}
          ${nodes}
        </svg>
        <p style="font-size:11px;color:var(--muted);max-width:300px">Clique nos eixos para marcar o que está alterado. Os sintomas assinalados também acendem eixos automaticamente.</p>
      </div>
      <div style="flex:1;min-width:260px">
        <h3 style="margin:0 0 8px;color:var(--primary2)">Micronutrientes mais sugeridos pelos sintomas</h3>
        <div>${topNutri.length?topNutri.map(([n,c])=>`<span class="chip chip-warn">${esc(n)} ×${c}</span>`).join(''):'<span class="chip">Nenhum sintoma marcado</span>'}</div>
        <h3 style="margin:14px 0 8px;color:var(--primary2)">Ligações com o prontuário</h3>
        <div class="btns">
          <button class="btn" onclick="selectedPacienteId=+$('#teiaPac').value;showView('exames')">Exames lab ${exames?'✓':'—'}</button>
          <button class="btn" onclick="selectedPacienteId=+$('#teiaPac').value;showView('alergias')">Alergias ${alerg&&(alerg.alergias||[]).length?'✓':'—'}</button>
          <button class="btn" onclick="selectedPacienteId=+$('#teiaPac').value;showView('plano')">Plano alimentar ${plano?'✓':'—'}</button>
        </div>
        ${alerg&&((alerg.alergias||[]).length||(alerg.intolerancias||[]).length)?`
          <p style="margin-top:8px"><b>Alergias:</b> ${esc((alerg.alergias||[]).join(', ')||'—')}<br>
          <b>Intolerâncias:</b> ${esc((alerg.intolerancias||[]).join(', ')||'—')}</p>`:''}
        ${exames?`<p style="margin-top:6px;color:var(--muted)">Exames registados em ${esc(exames.data||'—')}. Cruzar com Fe, B12, folato, vit. D, etc.</p>`:''}
      </div>
    </div>
  </div>
  <div class="panel">
    <h2>Questionário — sinais e sintomas de deficiências de micronutrientes</h2>
    <p style="color:var(--muted);margin-top:0">Marque o que o paciente refere. Ao lado, micronutrientes classicamente associados.</p>
    <div style="max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px">
      ${SINTOMAS_MICRO.map((s,i)=>`
        <label class="sintoma-item">
          <input type="checkbox" class="ckSint" data-i="${i}" ${marcados.has(i)?'checked':''} onchange="toggleSintomaTeia(${i},this.checked)">
          <span><b>${esc(s.t)}</b><br><span style="color:var(--muted)">${esc(s.n)}</span></span>
        </label>`).join('')}
    </div>
    <div class="field" style="margin-top:12px"><label>Deficiências / hipóteses encontradas (texto livre)</label>
      <textarea id="teiaHipot">${esc(dados.hipotese||'')}</textarea>
    </div>
    <div class="btns">
      <button class="btn btn-primary" onclick="salvarTeia()">Salvar teia e checklist</button>
      <button class="btn" onclick="imprimirA4()">Imprimir</button>
    </div>
  </div>`;
  window._teiaEixos=eixosOn;
  window._teiaSint=marcados;
}
function toggleSintomaTeia(i, on){
  if(!window._teiaSint) window._teiaSint=new Set();
  if(on) window._teiaSint.add(i); else window._teiaSint.delete(i);
}
function toggleEixoTeia(id){
  if(!window._teiaEixos) window._teiaEixos=new Set();
  if(window._teiaEixos.has(id)) window._teiaEixos.delete(id);
  else window._teiaEixos.add(id);
  // refresh visual only for nodes
  document.querySelectorAll('.teia-node').forEach(g=>{
    g.classList.toggle('on', window._teiaEixos.has(g.getAttribute('data-eixo')));
  });
}
function salvarTeia(){
  const id=$('#teiaPac').value;
  if(!id){ toast('Informe o paciente!'); return; }
  if(!DB.teia) DB.teia={};
  // merge eixos from symptoms
  const eixos=new Set(window._teiaEixos||[]);
  (window._teiaSint||[]).forEach(i=>{
    const s=SINTOMAS_MICRO[i]; if(s) (s.eixos||[]).forEach(e=>eixos.add(e));
  });
  DB.teia[id]={
    sintomas:[...(window._teiaSint||[])],
    eixos:[...eixos],
    hipotese:$('#teiaHipot').value,
    atualizado:new Date().toISOString().slice(0,10)
  };
  saveDB(); toast('Teia e checklist salvos!'); showView('teia');
}

function fillFitoPatient(){
  const id=+(document.getElementById('ftPac')||{}).value||selectedPacienteId;
  const pac=DB.pacientes.find(p=>p.id===id);
  if(!pac) return;
  selectedPacienteId=pac.id;
}
function loadFitoPlant(){
  const id=(document.getElementById('ftPlant')||{}).value;
  const p=PLANTS_FITO.find(x=>x.id===id)||PLANTS_FITO[0];
  if(!p) return;
  const set=(i,v)=>{const el=document.getElementById(i); if(el) el.value=v;};
  set('ftForm',p.form); set('ftDose',p.dose); set('ftQty',p.quantity); set('ftCaut',p.caution); set('ftInd',p.indication);
  renderFitoPreview();
}
function renderFitoPreview(){
  const id=+(document.getElementById('ftPac')||{}).value;
  const pac=DB.pacientes.find(p=>p.id===id);
  const g=i=>(document.getElementById(i)||{}).value||'';
  const d=g('ftDate'); let dPt=d; if(d&&d.includes('-')){const p=d.split('-'); dPt=p[2]+'/'+p[1]+'/'+p[0];}
  const nasc=pac&&pac.nasc?(()=>{const p=pac.nasc.split('-');return p[2]+'/'+p[1]+'/'+p[0];})():'—';
  document.getElementById('fpPac').textContent=pac?pac.nome:'—';
  document.getElementById('fpDate').textContent=dPt||'—';
  document.getElementById('fpNasc').textContent=nasc;
  document.getElementById('fpInd').textContent=g('ftInd')||'—';
  document.getElementById('fpForm').textContent=g('ftForm');
  document.getElementById('fpDose').textContent=g('ftDose');
  document.getElementById('fpQty').textContent=g('ftQty');
  document.getElementById('fpCaut').textContent=g('ftCaut');
  document.getElementById('fpNotes').textContent=g('ftNotes')||'Registrar alergias, medicamentos em uso e data de reavaliação.';
}

function renderPedidoExames(){
  const id=+(document.getElementById('rxPac')||{}).value;
  const pac=DB.pacientes.find(p=>p.id===id);
  const d=(document.getElementById('rxDate')||{}).value||'';
  let dPt=d; if(d.includes('-')){const p=d.split('-'); dPt=p[2]+'/'+p[1]+'/'+p[0];}
  const nasc=pac&&pac.nasc?(()=>{const p=pac.nasc.split('-');return p[2]+'/'+p[1]+'/'+p[0];})():'—';
  const checks=[...document.querySelectorAll('.rxExCk:checked')].map(x=>x.value);
  const outros=(document.getElementById('rxOutros')||{}).value||'';
  document.getElementById('rxpPac').textContent=pac?pac.nome:'—';
  document.getElementById('rxpDate').textContent=dPt||'—';
  document.getElementById('rxpNasc').textContent=nasc;
  document.getElementById('rxpSexo').textContent=pac?(pac.sexo==='M'?'Masculino':'Feminino'):'—';
  document.getElementById('rxpLista').textContent=checks.length?checks.map((x,i)=>(i+1)+'. '+x).join('\n'):'—';
  document.getElementById('rxpObs').textContent=outros||'Seguir orientações de preparo do laboratório.';
}

function atualizarRelogio(){
  const el=document.getElementById('topoRelogio');
  if(!el) return;
  const d=new Date();
  const pad=n=>String(n).padStart(2,'0');
  el.textContent = pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}
setInterval(atualizarRelogio,1000);
atualizarRelogio();
