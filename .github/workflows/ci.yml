name: CI Limanet

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-api:
    name: Validar API (Node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Instalar dependências
        run: npm ci || npm install

      - name: Verificar package.json e server.js
        run: |
          test -f package.json
          test -f server.js
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json OK')"
          node --check server.js

  check-frontend:
    name: Validar HTML frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar index.html
        run: |
          test -f index.html
          # Tamanho mínimo (evita commit acidental de ficheiro vazio)
          SIZE=$(wc -c < index.html)
          echo "index.html size: $SIZE bytes"
          test "$SIZE" -gt 10000
          # Marcadores essenciais do Limanet
          grep -q "Limanet" index.html
          grep -q "doLogin\|loginPass\|loginScreen" index.html
          echo "Frontend HTML OK"

  # O deploy em produção continua a cargo do Render (Auto-Deploy no push).
  # Este job só documenta o estado do CI.
  summary:
    name: Resumo CI
    runs-on: ubuntu-latest
    needs: [check-api, check-frontend]
    steps:
      - name: CI passou
        run: |
          echo "CI OK — API e HTML validados."
          echo "Deploy automático: configure Auto-Deploy no Render apontando para este repositório (branch main)."
